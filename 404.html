<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<style>
  :root { --bg: #f8f8fc; --text: #1b1b21; --muted: #5d5e6b; --accent: #3c4ea0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121318; --text: #e4e1e9; --muted: #a9a8b6; --accent: #b8c3ff; }
  }
  :root[data-theme="dark"] { --bg: #121318; --text: #e4e1e9; --muted: #a9a8b6; --accent: #b8c3ff; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Страница не найдена</h1>
  <p>Такой страницы нет. <a href="/">Все приложения</a></p>
</main>
</body>
</html>
